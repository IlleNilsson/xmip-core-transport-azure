[package]
name = "xmip-core-transport-azure"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-azure"
description = "What every Azure technology speaks over HTTP: the Shared Access Signature and Shared Key, both sides of each, and what a Service Bus namespace answers when it refuses. Not a transport of its own: azure-blob, azure-service-bus and azure-event-hubs ride on it. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): the error vocabulary and the XML reader.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", optional = true }
# What Azure speaks rides on HTTP: the request and its answer, the
# judgement of an answer and the RFC 1123 moment.
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main", optional = true }
# Percent-encoding (RFC 3986), written once for the estate, and the
# request and answer the signers and the namespace form (`net::http`).
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main", optional = true }
# XML character data escaped, both signatures, HMAC-SHA256 checked in
# constant time (codec::digest), and base64, which they are written in.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main", optional = true }
# The one clock (`xcore::Clock`), which a token's expiry and x-ms-date are
# read from, and the settings declaration `key_name` is written in
# (`xcore::settings`).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[dev-dependencies]

[features]
# What Azure speaks, and the declaration: the transport guide's "The
# declaration", module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:transport", "dep:http", "dep:net", "dep:codec"]
# The declaration alone: the setting azure-service-bus and azure-event-hubs
# declare, `key_name` (`key_name::key_name`), which a technology's own
# declaration takes.
declaration = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
