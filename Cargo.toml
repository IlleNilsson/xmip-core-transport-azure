# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-azure"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-azure"
description = "What every Azure technology speaks over HTTP: the Shared Access Signature and Shared Key, both sides of each, and what a Service Bus namespace answers when it refuses. Not a transport of its own: azure-blob, azure-service-bus and azure-event-hubs ride on it. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): the error vocabulary and the XML reader.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# What Azure speaks rides on HTTP: the request and its answer, the
# judgement of an answer, percent-encoding and the RFC 1123 moment.
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main" }
# XML character data escaped, and base64, which both signatures are
# written in.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }

# Both signatures are HMAC-SHA256 written as base64; the HMAC's own check is
# the constant-time comparison. Pure Rust and small.
sha2 = "0.10"
hmac = "0.12"

[dev-dependencies]

[features]
default = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
